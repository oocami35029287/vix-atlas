name: Refresh market data
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Tickers separated by commas (US or Taiwan), maximum 30'
        required: true
        default: 'SPY,QQQ,AAPL,NVDA,MSFT,TSLA,AMD,2330.TW,2317.TW,2454.TW'
  schedule:
    - cron: '30 23 * * 1-5'
permissions:
  contents: write
concurrency:
  group: refresh-market-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'requests>=2.32,<3'
      - name: Refresh selected datasets
        env:
          REQUESTED_SYMBOLS: ${{ inputs.symbols || 'SPY,QQQ,AAPL,NVDA,MSFT,TSLA,AMD,2330.TW,2317.TW,2454.TW' }}
        run: python refresh_data.py --symbols "$REQUESTED_SYMBOLS"
      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Update historical market datasets'
            git push
          fi
