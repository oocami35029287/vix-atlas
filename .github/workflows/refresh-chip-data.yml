name: Refresh chip research
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chip-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: node test_engine.cjs && node --test tests/test_research.cjs
      - run: python scripts/build_chip_snapshot.py
      - run: python scripts/run_chip_research.py
      - run: python build.py && python scripts/check_public_assets.py
      - name: Commit aggregate research only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/chip_report.json data/source_checks.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh aggregate chip proxy research'
            git push
          fi
